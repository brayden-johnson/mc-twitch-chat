name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version and whether to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          fi
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            # A new mod_version on main publishes a release automatically
            if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then RELEASE=true; fi
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Version $VERSION, release: $RELEASE"

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "error:|What went wrong|Could not|> " -A4 build.log | head -150 > errors.txt || true
          split -l 25 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build log ($f)::${msg}"
          done

      - name: Check mixin targets against Minecraft
        if: always()
        run: |
          JAR=$(find build/moddev ~/.gradle -name 'neoforge-*.jar' -path '*artifacts*' 2>/dev/null | grep -v sources | head -1)
          echo "Using $JAR"
          if [ -n "$JAR" ]; then
            out=$(javap -cp "$JAR" net.minecraft.client.gui.GuiGraphics | grep -E "drawString|blit\(net.minecraft.resources.ResourceLocation, int, int, float|setColor" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=GuiGraphics methods::${out}"
            chat=$(javap -c -p -cp "$JAR" net.minecraft.client.gui.components.ChatComponent | grep -E "GuiGraphics.drawString|GuiGraphics.blit|addMessage|deleteMessage" | sort | uniq -c | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::notice title=ChatComponent calls::${chat}"
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mc-twitch-chat
          path: build/libs/*.jar

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          target_commitish: ${{ github.sha }}
          name: MC Twitch Chat ${{ env.MOD_VERSION }}
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            For Minecraft 1.21.1 / NeoForge 21.1.x (FTB Stoneblock 4). Client-side only.

            Download the `.jar` below and drop it into your instance's `mods` folder.
