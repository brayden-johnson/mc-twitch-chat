plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = System.getenv('MOD_VERSION') ?: project.mod_version
group = project.mod_group_id

base {
    archivesName = "mc-twitch-chat-neoforge-${project.minecraft_version}"
}

// Minecraft 1.21.1 ships Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
